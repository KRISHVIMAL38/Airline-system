server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/KRISHVIMAL38/pushpak-air-config.git
          clone-on-start: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:9200/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false