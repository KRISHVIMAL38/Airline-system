
services:
  #database
  userdb:
    image: mysql:8.0
    container_name: userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "3302:3306"
    environment:
      MYSQL_DATABASE: airline_user
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  airlinecoredb:
    image: mysql:8.0
    container_name: airlinecoredb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "3303:3306"  # localhost only
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_core_db
    healthcheck:
      test: [ "CMD","mysqladmin","ping","-h","localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  flightopsdb:
    image: mysql:8.0
    container_name: flightopsdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "3304:3306"  # localhost only
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_flight_db
    healthcheck:
      test: [ "CMD","mysqladmin","ping","-h","localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

