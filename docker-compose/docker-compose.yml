  config-server:
    image: "krushnatmalavekar/gds-config-server:1.0.0"
    container_name: gds-config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5

    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "https://github.com/KRISHVIMAL38/pushpak-air-config.git"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


  service-registry:
    image: "krushnatmalavekar/gds-service-registry:1.0.0"
    container_name: gds-eureka-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
    environment:
     SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
     JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api-gateway:
    image: "krushnatmalavekar/gds-api-gateway:1.0.0"
    container_name: gds-gateway:1.0.0
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5000:5000"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      userdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"



